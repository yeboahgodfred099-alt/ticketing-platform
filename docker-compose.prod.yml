services:
  # ─── Nginx Reverse Proxy (Integrated with Host Traefik) ─────────
  nginx:
    image: nginx:1.27-alpine
    container_name: ticketing_prod_nginx
    restart: unless-stopped
    ports:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ticketing.rule=Host(`ticket.clevawave.com`)"
      - "traefik.http.routers.ticketing.entrypoints=websecure"
      - "traefik.http.routers.ticketing.tls.certresolver=letsencrypt"
      - "traefik.http.services.ticketing.loadbalancer.server.port=80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./infra/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    networks:
      - app_network

  # ─── Next.js 15 Frontend (Production Standalone) ───────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: ../infra/docker/frontend/Dockerfile
      target: runner
    container_name: ticketing_prod_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=/api/v1
    networks:
      - app_network

  # ─── Laravel 11 Backend (PHP 8.3-FPM) ───────────────────────────
  backend:
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile
    container_name: ticketing_prod_backend
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://ticket.clevawave.com
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-ticketing}
      - DB_USERNAME=${DB_USERNAME:-ticketing_app}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - QUEUE_CONNECTION=redis
      - PAYSTACK_PUBLIC_KEY=${PAYSTACK_PUBLIC_KEY}
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY}
      - PAYSTACK_WEBHOOK_SECRET=${PAYSTACK_WEBHOOK_SECRET}
      - MAIL_MAILER=${MAIL_MAILER:-smtp}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-tls}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-tickets@clevawave.com}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-ClevaWave Ticketing}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network
      - data_network

  # ─── Queue Worker ───────────────────────────────────────────────
  queue:
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile
    container_name: ticketing_prod_queue
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90
    volumes:
      - ./backend:/var/www/html
    environment:
      - APP_ENV=production
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-ticketing}
      - DB_USERNAME=${DB_USERNAME:-ticketing_app}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - QUEUE_CONNECTION=redis
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - app_network
      - data_network

  # ─── Background Scheduler (Reservations & Reconciliation) ───────
  scheduler:
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile
    container_name: ticketing_prod_scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    volumes:
      - ./backend:/var/www/html
    environment:
      - APP_ENV=production
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-ticketing}
      - DB_USERNAME=${DB_USERNAME:-ticketing_app}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - QUEUE_CONNECTION=redis
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - app_network
      - data_network

  # ─── PostgreSQL 16 (Authoritative Database) ─────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ticketing_prod_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ticketing}
      POSTGRES_USER: ${DB_USERNAME:-ticketing_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ticketing_app} -d ${DB_DATABASE:-ticketing}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - data_network

  # ─── Redis 7 (Cache, Queues & Distributed Locks) ────────────────
  redis:
    image: redis:7-alpine
    container_name: ticketing_prod_redis
    restart: unless-stopped
    command: >
      sh -c 'if [ -n "$REDIS_PASSWORD" ]; then
        redis-server --requirepass "$REDIS_PASSWORD" --appendonly yes;
      else
        redis-server --appendonly yes;
      fi'
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - data_network

networks:
  app_network:
    driver: bridge
  data_network:
    driver: bridge
    internal: true

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
