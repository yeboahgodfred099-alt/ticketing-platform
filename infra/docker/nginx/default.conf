upstream frontend_upstream {
    server frontend:3000;
}

upstream backend_upstream {
    server backend:9000;
}

server {
    listen 80;
    server_name ticket.clevawave.com localhost;
    root /var/www/html/public;

    charset utf-8;
    client_max_body_size 15M;

    # Public checkout rate limiting
    location /api/v1/public/checkout {
        limit_req zone=checkout_protect burst=5 nodelay;
        fastcgi_pass backend_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60;
    }

    # Administrative auth rate limiting
    location /api/v1/auth/login {
        limit_req zone=auth_protect burst=3 nodelay;
        fastcgi_pass backend_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60;
    }

    # All API endpoints to Laravel backend
    location /api/ {
        limit_req zone=api_general burst=20 nodelay;
        fastcgi_pass backend_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60;
    }

    # Sanctum CSRF cookie
    location /sanctum/ {
        fastcgi_pass backend_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60;
    }

    # Next.js static assets
    location /_next/ {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # All frontend routes
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
