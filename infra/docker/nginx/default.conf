server {
    listen 80;
    server_name ticket.clevawave.com localhost;
    root /var/www/html/public;

    index index.php index.html;
    charset utf-8;

    client_max_body_size 15M;

    # Backend API endpoints
    location /api/ {
        limit_req zone=api_general burst=20 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Public checkout rate limiting
    location /api/v1/public/checkout {
        limit_req zone=checkout_protect burst=5 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Administrative auth rate limiting
    location /api/v1/auth/login {
        limit_req zone=auth_protect burst=3 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
