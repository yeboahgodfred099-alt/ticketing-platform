services:
  # ─── Nginx Reverse Proxy & Static Asset Server ─────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: ticketing_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./infra/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started
    networks:
      - app_network

  # ─── Laravel 11 Backend (PHP 8.3-FPM) ──────────────────────────────
  backend:
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile
    container_name: ticketing_backend
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=ticketing
      - DB_USERNAME=ticketing_app
      - DB_PASSWORD=secret_ticketing_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      - MAIL_MAILER=smtp
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network
      - data_network

  # ─── Queue Worker ─────────────────────────────────────────────────
  queue:
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile
    container_name: ticketing_queue
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90
    volumes:
      - ./backend:/var/www/html
    environment:
      - APP_ENV=local
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=ticketing
      - DB_USERNAME=ticketing_app
      - DB_PASSWORD=secret_ticketing_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - app_network
      - data_network

  # ─── Scheduler ───────────────────────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile
    container_name: ticketing_scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    volumes:
      - ./backend:/var/www/html
    environment:
      - APP_ENV=local
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=ticketing
      - DB_USERNAME=ticketing_app
      - DB_PASSWORD=secret_ticketing_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - app_network
      - data_network

  # ─── PostgreSQL 16 ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ticketing_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ticketing
      POSTGRES_USER: ticketing_app
      POSTGRES_PASSWORD: secret_ticketing_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing_app -d ticketing"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - data_network

  # ─── Redis 7 ──────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ticketing_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - data_network

  # ─── Mailpit (Local Email Testing) ────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: ticketing_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
    networks:
      - app_network

  # ─── Next.js 15 Frontend ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: ../infra/docker/frontend/Dockerfile
      target: dev
    container_name: ticketing_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
  data_network:
    driver: bridge
    internal: false

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

